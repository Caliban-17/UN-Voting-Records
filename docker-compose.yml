services:
  un-voting-app:
    build: .
    container_name: un-voting-analyzer
    ports:
      - "8080:5001"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    environment:
      - PORT=5001
      - CACHE_DIR=.cache
      - CACHE_TTL_HOURS=24
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Complete roll calls, refreshed outside the web process. The app only reads
  # the CSV; its pulse worker notices a promoted file and reloads it. Daily on
  # success, hourly after a failure; keeps two archives for rollback.
  un-voting-refresher:
    build: .
    container_name: un-voting-refresher
    command:
      - sh
      - -c
      - >-
        while true; do
        if python scripts/refresh_data.py --days 90 --promote --keep-archives 2;
        then sleep 86400; else sleep 3600; fi;
        done
    volumes:
      - ./data:/app/data
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      disable: true
