services:
  un-voting-app:
    build: .
    container_name: un-voting-analyzer
    ports:
      - "8080:5001"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    environment:
      - PORT=5001
      - CACHE_DIR=.cache
      - CACHE_TTL_HOURS=24
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
